<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO List</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: black;
            color: white;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .heading {
            display: flex;
            justify-content: center;
        }

        .heading h1 {
            font-size: 70px;
            text-align: center;
        }

        .form-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        form {
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 950px;
        }

        label {
            font-size: 35px;
            white-space: nowrap;
        }

        input {
            height: 40px;
            flex: 1;
            min-width: 0;
            font-size: 25px;
        }

        button {
            height: 40px;
            width: 100px;
            font-size: 22px;
        }

        .todoitem {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-top: 40px;
        }

        /* Mobile */
        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .heading h1 {
                font-size: 40px;
            }

            form {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            label {
                font-size: 25px;
            }

            input {
                width: 100%;
                height: 45px;
                font-size: 20px;
            }

            button {
                width: 100%;
                height: 45px;
                font-size: 20px;
            }

            .todoitem {
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="heading">
        <h1>TODO-LIST</h1>
    </div>

    <div class="form-wrapper">
        <form>

            <label for="text">
                TODO:
            </label>

            <input
                type="text"
                id="text"
                name="text"
            >

            <button
                type="submit"
                disabled>
                Add
            </button>

        </form>
    </div>

    <div class="todoitem"></div>

    <script src="script.js"></script>

</body>

</html>
